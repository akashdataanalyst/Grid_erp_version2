[project]
name = "grid_erp"
authors = [
    {name = "Calco PolyTechnik Pvt Ltd", email = "mis.1@calco.in"}
]
description = "Calco PolyTechnik Manufacturing ERP - Branding, WhatsApp, Recruitment Assessment, Interviews and AI Assistant"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Grid AI: only used by the Claude provider; other providers use plain HTTP via `requests` (bundled with Frappe).
    "anthropic",
    # Grid Interview: PyJWT signs Jitsi tokens; boto3 is only imported when the S3 storage backend is enabled.
    "PyJWT>=2.8.0",
    "boto3>=1.34",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "grid_erp"
